name: gRPC protobuf contract

on:
  push:
    branches: [codex/grpc-generated-stubs]
    paths:
      - .github/workflows/grpc-proto.yml
      - buf.gen.yaml
      - buf.yaml
      - internal/transport/grpc/**
      - proto/**
      - scripts/check-generated-proto.sh
      - scripts/generate-proto.sh
      - scripts/validate-generated-proto.sh
  pull_request:
    branches: [develop, main]
    paths:
      - .github/workflows/grpc-proto.yml
      - buf.gen.yaml
      - buf.yaml
      - internal/transport/grpc/**
      - proto/**
      - scripts/check-generated-proto.sh
      - scripts/generate-proto.sh
      - scripts/validate-generated-proto.sh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-go-stubs:
    name: Generate and test canonical Go stubs
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up pinned Buf CLI
        uses: bufbuild/buf-action@fd21066df7214747548607aaa45548ba2b9bc1ff
        with:
          version: "1.71.0"
          checksum: d3de2838c68a5759ca276884254bc70df4e4ad185d6ed5f65f327b6ce6363eab
          setup_only: true
          github_token: ${{ github.token }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate canonical stubs
        run: ./scripts/generate-proto.sh

      - name: Validate canonical generator identity
        run: ./scripts/validate-generated-proto.sh

      - name: Check committed stubs for drift
        id: drift
        continue-on-error: true
        run: ./scripts/check-generated-proto.sh

      - name: Test generated descriptor and default-codec wire contract
        run: >-
          go test -race -count=1 -tags grpcwire
          ./proto/gen/go/muninn/v1
          ./internal/transport/grpc

      - name: Vet generated transport
        run: >-
          go vet -tags grpcwire
          ./proto/gen/go/muninn/v1
          ./internal/transport/grpc

      # Only expose the two canonical files after generation, identity checks,
      # default-codec tests, and vet have all succeeded.
      - name: Upload canonical stubs when committed output drifts
        if: success() && steps.drift.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: canonical-go-stubs
          path: |
            proto/gen/go/muninn/v1/service.pb.go
            proto/gen/go/muninn/v1/service_grpc.pb.go
          if-no-files-found: error
          retention-days: 7

      - name: Enforce generated-code drift gate
        if: success() && steps.drift.outcome == 'failure'
        run: |
          echo "Canonical generated Go stubs differ from the committed files."
          echo "Use the canonical-go-stubs artifact from this run."
          exit 1
