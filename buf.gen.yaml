version: v2
clean: true

plugins:
  # Keep the generator aligned with google.golang.org/protobuf in go.mod.
  - remote: buf.build/protocolbuffers/go:v1.36.11
    revision: 1
    out: proto/gen/go
    opt: paths=source_relative
  # protoc-gen-go-grpc v1.6.2 emits the supported generic streaming aliases
  # and is compatible with the repository's grpc-go v1.79.1 runtime.
  - remote: buf.build/grpc/go:v1.6.2
    revision: 1
    out: proto/gen/go
    opt: paths=source_relative

inputs:
  - directory: proto
